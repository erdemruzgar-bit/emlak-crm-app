services:
  postgres:
    image: postgres:16-alpine
    container_name: emlak-crm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: emlak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: emlak_crm
    ports:
      # Yalnızca loopback'e bağla — Postgres dışarıya açık olmamalı (app aynı makinede,
      # DATABASE_URL localhost üzerinden bağlanır). Güvenlik: dış brute-force yüzeyini kaldırır.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
