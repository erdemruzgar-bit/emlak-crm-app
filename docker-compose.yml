services:
  postgres:
    image: postgres:16-alpine
    container_name: emlak-crm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: emlak
      POSTGRES_PASSWORD: emlak123
      POSTGRES_DB: emlak_crm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
